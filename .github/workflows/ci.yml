name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spm:
    name: SPM tests and demo build
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Unit tests and demo build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The demo's released OpenVideo package is this repo; the job token reads it.
          # Passed to git through the environment of this step only, never written to disk.
          basic="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$basic"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/ezoic/open-video-swift-sdk.git.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $basic"
          SIM_NAME="$(xcrun simctl list devices available | grep -oE 'iPhone [0-9][0-9A-Za-z ]*' | head -n 1 | sed -E 's/[[:space:]]+$//' || true)"
          if [ -z "$SIM_NAME" ]; then
            echo "::error::No available iPhone simulator found on the runner"
            exit 1
          fi
          echo "Using simulator: $SIM_NAME"
          xcodebuild test -scheme OpenVideo-Package \
            -destination "platform=iOS Simulator,name=$SIM_NAME" \
            -only-testing:OpenVideoCoreTests \
            -scmProvider system -skipPackagePluginValidation \
            COMPILER_INDEX_STORE_ENABLE=NO
          # A release commit bumps the demo pin before its tag exists; build the
          # demo only once the pinned tag is on GitHub.
          pin="$(sed -nE 's/^[[:space:]]*version = ([0-9][^; ]*) *;/\1/p' Examples/OpenVideoDemo/OpenVideoDemo.xcodeproj/project.pbxproj | head -n 1)"
          if [[ ! "$pin" =~ ^[0-9]+[.][0-9]+[.][0-9]+(-[0-9A-Za-z]+([.][0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::Cannot read the demo's OpenVideo version pin"
            exit 1
          fi
          tags="$(git ls-remote --tags https://github.com/ezoic/open-video-swift-sdk.git "refs/tags/v$pin" "refs/tags/$pin")"
          if [ -z "$tags" ]; then
            echo "::notice::OpenVideo $pin is not tagged yet; skipped the demo build from the released package."
            exit 0
          fi
          xcodebuild build -project Examples/OpenVideoDemo/OpenVideoDemo.xcodeproj -scheme OpenVideoDemo \
            -destination "platform=iOS Simulator,name=$SIM_NAME" \
            -scmProvider system -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO

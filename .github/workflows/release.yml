name: Release

# Check the SDK version against the tag before creating a GitHub Release.
# Swift Package Manager consumes source from the tag.

on:
  push:
    tags:
      - 'v*'
  # A repository writer may use this only to rerun an existing, matching release tag.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example, v0.1.1)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Validate selected tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+[.][0-9]+[.][0-9]+(-[0-9A-Za-z]+([.][0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::Invalid release tag: $RELEASE_TAG"
            exit 1
          fi

      - name: Check out selected tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Check tag against SDK version strings
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          fail=0
          check() {
            local file="$1" pattern="$2"
            if ! grep -qF -- "$pattern" "$file"; then
              echo "::error::$file does not contain $pattern"
              fail=1
            fi
          }
          check Sources/OpenVideo/OpenVideo.swift "version = \"$version\""
          check Sources/OpenVideoCore/OpenVideoAPIClient.swift "clientHeader = \"OpenVideoSDK/$version\""
          exit "$fail"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; nothing to upload (source release)."
            exit 0
          fi
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$RELEASE_TAG" --prerelease
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
